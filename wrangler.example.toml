# Wrangler Configuration
# Vul deze waarden in met je Cloudflare credentials

name = "cloudflare-cms"
main = "src/index.ts"
compatibility_date = "2024-08-21"
compatibility_flags = ["nodejs_compat"]

# Local development
[env.development]
name = "cloudflare-cms-dev"

# Production environment
[env.production]
name = "cloudflare-cms-prod"
routes = [
  { pattern = "cms.yourdomain.com/*", zone_name = "yourdomain.com" }
]

# Database bindings
[[d1_databases]]
binding = "DB"
database_name = "cms_db"
database_id = "YOUR_DB_ID"

# Storage bindings
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "cms-storage"
account_id = "YOUR_ACCOUNT_ID"

# Environment variables
[vars]
JWT_SECRET = "your-secret-key-change-this"
JWT_EXPIRY = "24h"
SESSION_TIMEOUT = "3600"
MAX_LOGIN_ATTEMPTS = "5"
LOCKOUT_DURATION = "900"
STORAGE_URL = "https://your-r2-domain.com"

# Triggers for scheduled tasks
[triggers.crons]
crons = ["0 0 * * *"]  # Run daily at midnight
